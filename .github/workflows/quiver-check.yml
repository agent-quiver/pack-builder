# The pack standard's gate (STANDARD.md §5): every pull request, push to main and release tag.
name: quiver-check
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the secret scan reads the history
      - uses: agent-quiver/quiver-check@396958d511761b72bb538d368f8f154f9af56f2b # pinned by commit until quiver-check is tagged
