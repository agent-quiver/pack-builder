id: agent-quiver/pack-builder
version: 0.1.0
title: Pack builder
card: 'Building a Quiver pack: start one, turn existing agent instructions into artifacts, check it and release it.'
description: 'The pack for making packs. new-pack starts a repository from the template; import-instructions turns
  an existing CLAUDE.md, AGENTS.md, Cursor rules or prompt files into skills and rulebooks; add-artifact writes one
  artifact to the standard; release-pack tags a version that Quiver serves. The pack standard ships with it as a
  rulebook.'
maintainers:
- agent-quiver
license: CC-BY-4.0
tags:
- packs
- authoring
- meta
requires: []
compatibility:
  quiver: '>=1.0.0 <2.0.0'
